fields:
  person.employee_id:
    type: string
    synonyms: [employee id, emp id, employee number, emp no, staff id, ee id, employee]
    validator: {regex: '^[A-Z]{0,3}\d{2,8}$'}
  person.full_name:
    type: person_name
    synonyms: [employee name, name, staff, staff member, staff name, employee, name on license, emp, licensee]
    validator: {person_name: true}
  person.given_name:
    type: string
    synonyms: [first name, first, given name, fname, forename]
    validator: {single_name_token: true}
  person.family_name:
    type: string
    synonyms: [last name, last, surname, family name, lname]
    validator: {single_name_token: true}
  person.role:
    type: vocab
    vocab: roles
    synonyms: [job title, title, role, job code, position, class, cls, job, discipline]
    validator: {vocab: roles}
  person.facility:
    type: vocab
    vocab: facilities
    synonyms: [facility, facility code, site, location, building, campus, facility name]
    validator: {vocab: facilities}
  person.phone:
    type: phone
    synonyms: [phone, phone number, mobile, cell, telephone, contact number]
    validator: {phone: true}
  person.hire_date:
    type: date
    synonyms: [hire date, start date, date hired, doh, hired]
    validator: {date: true}
  credential.number:
    type: string
    synonyms: [license number, license no, license, lic no, lic number, cert number, credential number, certificate number]
    # RN-551203, CNA771045, and state formats such as WA DOH 'RN.RN.00094584' / 'RN.RN.61687583.MSL'
    validator: {regex: '^[A-Z]{2,5}(?:[.\- ][A-Z]{1,5}){0,2}[.\- ]?\d{3,10}(?:[.\- ][A-Z]{1,5})?$'}
  credential.policy_number:
    type: string
    synonyms: [policy number, policy no, policy, cert no, certificate no, coverage number]
    validator: {regex: '^(?=.*\d)[A-Z0-9][A-Z0-9\-/ ]{2,24}$'}
  credential.type:
    type: vocab
    vocab: roles
    synonyms: [license type, credential type, cert type, type]
    validator: {vocab: roles}
  credential.doc_type:
    type: string
    synonyms: [doc type, document type, document, paperwork type, certificate type]
    validator: {non_empty: true}
  credential.expires_on:
    type: date
    synonyms: [expiration, expiration date, license expiration, expires, exp, exp date, valid until, expiry, expiry date]
    validator: {date: true}
  credential.last_verified:
    type: date
    synonyms: [last verified, verified on, verification date, verified]
    validator: {date: true}
  credential.issued_on:
    type: date
    synonyms: [issued, issue date, effective, eff, effective date]
    validator: {date: true}
  pay.payroll_id:
    type: string
    synonyms: [payroll id, pay id, ref, reference, check no, payroll number]
    validator: {regex: '^[A-Z]{1,3}-?\d{2,10}$'}
  pay.period_start:
    type: date
    synonyms: [period start, pay period start, week begin, wk beg, week start, from, start]
    validator: {date: true}
  pay.period_end:
    type: date
    synonyms: [period end, pay period end, week end, wk end, week ending, to, end]
    validator: {date: true}
  pay.hours_paid:
    type: number
    synonyms: [hours paid, hours, hrs, paid hours, total hours, hours worked]
    validator: {number: {min: 0, max: 120}}
  schedule.day:
    type: shift_cell
    repeatable: true
    header_pattern: '^((mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+)?(\d{1,2}/\d{1,2}(/\d{2,4})?|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?|(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2})$'
    validator: {shift_token_or_off: true}
  org.name:
    type: string
    synonyms: [vendor, vendor name, company, supplier, organization, contractor, carrier, insurer, insurance company]
    validator: {non_empty: true}
  contact.email:
    type: email
    synonyms: [email, contact, contact email, e-mail]
    validator: {email: true}
