[project]
name = "sot"
version = "0.1.0"
description = "Harborview Source of Truth: adaptive ingestion engine + shift-level evidence graph"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "duckdb>=1.1",
  "polars>=1.8",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "python-calamine>=0.2",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",
  "rapidfuzz>=3.9",
  "jellyfish>=1.1",
  "scipy>=1.13",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.112", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sot"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/ ; run: ruff check sot tools packs
select = ["F", "E", "B", "SIM", "UP", "PL", "RUF"]
ignore = [
  "E501",     # long lines are wrapped by hand at 120
  "PLR2004",  # magic numbers: thresholds are named in the pack/settings or documented inline
  "PLR0913", "PLR0917",  # pipeline stage signatures carry explicit keyword context
  "PLC0415",  # deliberate lazy imports (circular registries, heavy optional deps)
  "RUF001", "RUF002", "RUF003",  # typographic quotes/dashes are real data in name and date normalisers
  "B905",     # zip() over ragged table rows is intentional (shortest wins)
]
